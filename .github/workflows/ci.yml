name: CI Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v2

    - name: Instalar Node.js
      uses: actions/setup-node@v2
      with:
        node-version: "14"

    - name: Instalar dependencias, iniciar servidor y ejecutar pruebas
      run: |
        npm install
        node index.js &
        sleep 5
        npm test